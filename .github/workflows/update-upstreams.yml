name: Update upstreams
on:
  workflow_dispatch:
    inputs:
      module:
        description: Upstream to update
        required: true
        type: choice
        options: [all, web2api-web, ai-video-generation]
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: ./scripts/bootstrap.sh
      - name: Update and verify
        env:
          TARGET_MODULE: ${{ inputs.module }}
        run: python3 scripts/upstream.py update "$TARGET_MODULE"
      - name: Open reviewed update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          branch="upstream/refresh-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$branch"
          git add upstream upstream-lock.json
          git commit -m "chore: refresh verified upstream pins"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: refresh verified upstream pins" --body "Updates pinned upstream modules after dependency installation, frontend build and backend compatibility tests. Review the submodule commit range before merging."
