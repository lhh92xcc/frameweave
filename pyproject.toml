[project]
name = "frameweave"
version = "0.1.0"
description = "A unified visual workshop for AI image and video production"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "python-dotenv>=1,<2",
    "cos-python-sdk-v5>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
